# Prerequisite: download/load the licensed EAP image and apply this local tag.
# Local IRIS runtime; bootstrap compiles sources and configures authenticated WSGI.
services:
  init-data:
    image: iris-community:2026.3.0AI.154.0
    pull_policy: never
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 51773:51773 /durable"]
    volumes:
      - iris-data:/durable
  iris:
    image: iris-community:2026.3.0AI.154.0
    pull_policy: never
    init: true
    depends_on:
      init-data:
        condition: service_completed_successfully
    environment:
      ISC_DATA_DIRECTORY: /durable/irissys
    ports:
      - "127.0.0.1:1972:1972"
      - "127.0.0.1:52773:52773"
    volumes:
      - ../src/iris:/opt/studio/src:ro
      - ../tests/iris:/opt/studio/tests:ro
      - ../backend:/opt/studio/backend:ro
      - ../contracts:/opt/studio/contracts:ro
      - ./bootstrap:/opt/studio/bootstrap:ro
      - iris-data:/durable
volumes:
  iris-data:
